[package]
name = "shell"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
engine = { path = "../engine" }
eventlog = { path = "../eventlog" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
qrcode = { version = "0.14", default-features = false }
p2p-link = { version = "0.1.0", path = "../p2p-link" }

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "MouseEvent",
  "DomRect", # get_bounding_client_rect's return type needs its own feature

  # Pinch-zoom and pan on the board
  "Touch",
  "TouchEvent",
  "TouchList",

  # WebRTC
  "RtcPeerConnection",
  "RtcConfiguration",
  "RtcIceServer",
  "RtcIceGatheringState",
  "RtcSessionDescription",
  "RtcSessionDescriptionInit",
  "RtcSdpType",
  "RtcDataChannel",
  "RtcDataChannelEvent",
  "RtcDataChannelInit",
  "RtcDataChannelState",
  "MessageEvent",
  "Location",
  "HtmlTextAreaElement",
  "HtmlSelectElement",

  # Deflate, so the link in the QR code is a third of the size. The two
  # stream constructors are declared in zip.rs — web-sys puts them behind
  # --cfg=web_sys_unstable_apis, which would infect every build.
  "ReadableStream",
  "WritableStream",
  "ReadableWritablePair",
  "Blob",
  "Response",
  "console",
  "RtcPeerConnectionState",
  "RtcIceConnectionState",
  "RtcDataChannelType",
  "Navigator",
  "Clipboard",
  "CssStyleDeclaration",
]
