[package]
name = "shell"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
engine = { path = "../engine" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "MouseEvent",
  "DomRect", # get_bounding_client_rect's return type needs its own feature

  # WebRTC
  "RtcPeerConnection",
  "RtcConfiguration",
  "RtcIceServer",
  "RtcIceGatheringState",
  "RtcSessionDescription",
  "RtcSessionDescriptionInit",
  "RtcSdpType",
  "RtcDataChannel",
  "RtcDataChannelEvent",
  "RtcDataChannelInit",
  "RtcDataChannelState",
  "MessageEvent",
  "Location",
  "HtmlTextAreaElement",
  "console",
  "RtcPeerConnectionState",
  "RtcIceConnectionState",
  "RtcDataChannelType",
]
