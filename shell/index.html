<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minesweeper</title>
  <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="0">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      gap: 1rem;
      background: #1b1f27;
      color: #7a8494;
      font: 13px ui-monospace, monospace;
    }
    canvas { touch-action: none; cursor: pointer; }
    /* The bitmap is 2x the logical board so the browser downscales rather
       than upscales it — sharp on a phone, sharp on a hidpi laptop. */
    #board { width: min(92vw, 34rem); height: auto; }
    #controls { display: flex; flex-wrap: wrap; gap: .5rem; width: min(92vw, 34rem); }
    select {
      flex: 1; padding: .5rem; font: inherit; color: #dfe2e7;
      background: #2b3038; border: 1px solid #3a424e;
    }
    #signalling, #handshake { display: grid; gap: .5rem; width: min(90vw, 30rem); }
    .row { display: flex; gap: .5rem; }
    button {
      flex: 1; padding: .5rem; cursor: pointer;
      font: inherit; color: #dfe2e7;
      background: #2b3038; border: 1px solid #3a424e;
    }
    button:hover { background: #353c46; }
    /* Hidden until the host has a link to be answered. */
    #replybox {
      display: none; gap: .5rem;
      padding: .75rem; margin-top: .25rem;
      border: 1px dashed #3a424e; background: #171b23;
    }
    #replybox p { margin: 0 0 .1rem; color: #8f9aab; }
    #replybox strong { color: #dfe2e7; }
    #qr { display: none; width: min(80vw, 22rem); height: auto; image-rendering: pixelated; justify-self: center; background: #fff; padding: 0; }
    #log {
      font: 10px/1.5 ui-monospace, monospace; color: #7a8494;
      background: #12161d; border: 1px solid #2a323e; padding: .5rem;
      max-height: 11rem; overflow: auto; margin: 0; white-space: pre-wrap;
    }
    textarea {
      font: 11px/1.4 ui-monospace, monospace;
      color: #b6bcc6; background: #12161d;
      border: 1px solid #2a323e; padding: .5rem;
      resize: vertical; width: 100%;
    }
  </style>
</head>
<body>
  <canvas id="board" width="576" height="576"></canvas>
  <div id="controls">
    <button id="flag" type="button">Flag mode: off</button>
    <select id="level">
      <option>Beginner — 9x9, 10 mines</option>
      <option>Intermediate — 16x16, 40 mines</option>
      <option>Expert — 30x16, 99 mines</option>
    </select>
    <button id="restart" type="button">New game</button>
  </div>
  <p id="status">Solo game. To play together: press Host, or paste a link you were sent.</p>

  <section id="signalling">
    <div id="handshake">
      <div class="row">
        <button id="go" type="button">Host a game</button>
        <button id="join" type="button">Join with a link</button>
      </div>
      <textarea id="sig" rows="2" spellcheck="false"
        placeholder="Or paste a link here — it is acted on the moment it lands."></textarea>
      <!-- Only the host ever needs this, and only after their link exists. -->
      <section id="replybox">
        <p><strong>Step 2</strong> — they answered with a reply link. Paste it here.</p>
        <textarea id="reply" rows="2" spellcheck="false"
          placeholder="Paste their reply link"></textarea>
        <button id="connect" type="button">Connect</button>
      </section>
      <canvas id="qr" width="0" height="0"></canvas>
    </div>
    <pre id="log"></pre>
  </section>
</body>
</html>
