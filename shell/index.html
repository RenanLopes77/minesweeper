<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minesweeper</title>
  <link data-trunk rel="rust" href="Cargo.toml">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      gap: 1rem;
      background: #1b1f27;
      color: #7a8494;
      font: 13px ui-monospace, monospace;
    }
    canvas { touch-action: none; cursor: pointer; }
    #signalling { display: grid; gap: .5rem; width: min(90vw, 30rem); }
    .row { display: flex; gap: .5rem; }
    button {
      flex: 1; padding: .5rem; cursor: pointer;
      font: inherit; color: #dfe2e7;
      background: #2b3038; border: 1px solid #3a424e;
    }
    button:hover { background: #353c46; }
    #qr { display: none; width: min(80vw, 22rem); height: auto; image-rendering: pixelated; justify-self: center; background: #fff; padding: 0; }
    #log {
      font: 10px/1.5 ui-monospace, monospace; color: #7a8494;
      background: #12161d; border: 1px solid #2a323e; padding: .5rem;
      max-height: 11rem; overflow: auto; margin: 0; white-space: pre-wrap;
    }
    textarea {
      font: 11px/1.4 ui-monospace, monospace;
      color: #b6bcc6; background: #12161d;
      border: 1px solid #2a323e; padding: .5rem;
      resize: vertical; width: 100%;
    }
  </style>
</head>
<body>
  <canvas id="board" width="288" height="288"></canvas>
  <p id="status">left-click reveal &middot; right-click flag</p>

  <section id="signalling">
    <div class="row">
      <button id="host" type="button">Host</button>
      <button id="accept" type="button">Accept pasted</button>
      <button id="copy" type="button">Copy</button>
    </div>
    <textarea id="sig" rows="2" spellcheck="false"
      placeholder="Press Host to get a link. Or paste a link here and press Accept."></textarea>
    <canvas id="qr" width="0" height="0"></canvas>
    <pre id="log"></pre>
  </section>
</body>
</html>
