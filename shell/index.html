<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minesweeper</title>
  <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="0">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      gap: 1rem;
      background: #1b1f27;
      color: #7a8494;
      font: 13px ui-monospace, monospace;
    }
    canvas { touch-action: none; cursor: pointer; }
    /* The bitmap is 2x the logical board so the browser downscales rather
       than upscales it — sharp on a phone, sharp on a hidpi laptop. */
    /* Sized by the cell, not by a fixed width: whichever of the three limits
       bites first wins. 34px a cell keeps Expert from filling a desktop; the
       vh term keeps a tall board inside the window; the vw term is the phone.
       --cols/--rows are set from Rust whenever the board changes shape. */
    :root { --cols: 9; --rows: 9; --board: min(96vw, calc(var(--cols) * 34px), calc(70vh * var(--cols) / var(--rows))); }
    /* The viewport clips the board when it is pinch-zoomed; the transform on
       the canvas is set from Rust (view.rs) and does not affect layout, so
       the page never jumps while zooming. */
    #viewport { width: var(--board); overflow: hidden; touch-action: none; }
    #board { width: var(--board); height: auto; display: block; transform-origin: 0 0; }
    /* A stand-in for the flag toggle, shown only while the real one is
       scrolled out of view — flagging is the one control needed mid-game. */
    #flagfloat {
      display: none; position: fixed; right: .75rem; bottom: .75rem; z-index: 10;
      width: 3rem; height: 3rem; border-radius: 50%; font-size: 1.3rem;
      color: #dfe2e7; background: #2b3038; border: 1px solid #3a424e;
      box-shadow: 0 2px 8px rgba(0,0,0,.5); cursor: pointer;
    }
    /* The controls track the board so the two line up at any size. */
    #controls { display: flex; flex-wrap: wrap; gap: .5rem; width: var(--board); }
    #hud { font: 15px ui-monospace, monospace; color: #dfe2e7; letter-spacing: .05em; }
    #banner {
      font: bold 15px ui-monospace, monospace; letter-spacing: .05em;
      padding: .4rem .8rem; border: 1px solid currentColor; border-radius: 2px;
    }
    #banner:empty { display: none; }
    #banner.win { color: #6ec177; }
    #banner.lose { color: #e06c60; }
    select {
      flex: 1; padding: .5rem; font: inherit; color: #dfe2e7;
      background: #2b3038; border: 1px solid #3a424e;
    }
    #signalling, #handshake { display: grid; gap: .5rem; width: min(90vw, 30rem); }
    .row { display: flex; gap: .5rem; }
    button {
      flex: 1; padding: .5rem; cursor: pointer;
      font: inherit; color: #dfe2e7;
      background: #2b3038; border: 1px solid #3a424e;
    }
    button:hover { background: #353c46; }
    /* Hidden until the host has a link to be answered. */
    #replybox {
      display: none; gap: .5rem;
      padding: .75rem; margin-top: .25rem;
      border: 1px dashed #3a424e; background: #171b23;
    }
    #replybox p { margin: 0 0 .1rem; color: #8f9aab; }
    #replybox strong { color: #dfe2e7; }
    #qr { display: none; width: min(80vw, 22rem); height: auto; image-rendering: pixelated; justify-self: center; background: #fff; padding: 0; }
    #log {
      font: 10px/1.5 ui-monospace, monospace; color: #7a8494;
      background: #12161d; border: 1px solid #2a323e; padding: .5rem;
      max-height: 11rem; overflow: auto; margin: 0; white-space: pre-wrap;
    }
    textarea {
      font: 11px/1.4 ui-monospace, monospace;
      color: #b6bcc6; background: #12161d;
      border: 1px solid #2a323e; padding: .5rem;
      resize: vertical; width: 100%;
    }
  </style>
</head>
<body>
  <div id="hud">10 flags left &middot; 0s</div>
  <!-- Empty while the game is on; CSS hides it, so the board never moves. -->
  <div id="banner"></div>
  <div id="viewport"><canvas id="board" width="576" height="576"></canvas></div>
  <button id="flagfloat" type="button" title="Flag mode">🚩</button>
  <div id="controls">
    <button id="flag" type="button">Flag mode: off</button>
    <!-- Filled from app::LEVELS at startup, so the labels and the numbers
         they describe cannot drift apart. -->
    <select id="level"></select>
    <!-- Filled from engine::Mode at startup: the nth option *is* the nth
         variant, and that is now enforced by the code rather than by this
         comment. The mode travels on Start, so both peers play the same game. -->
    <select id="mode"></select>
    <button id="restart" type="button">New game</button>
  </div>
  <p id="status">Solo game. To play together: press Host, or paste a link you were sent.</p>

  <section id="signalling">
    <div id="handshake">
      <div class="row">
        <button id="go" type="button">Host a game</button>
        <button id="join" type="button">Join with a link</button>
      </div>
      <textarea id="sig" rows="2" spellcheck="false"
        placeholder="Or paste a link here — it is acted on the moment it lands."></textarea>
      <!-- Only the host ever needs this, and only after their link exists. -->
      <section id="replybox">
        <p><strong>Step 2</strong> — they answered with a reply link. Paste it here.</p>
        <textarea id="reply" rows="2" spellcheck="false"
          placeholder="Paste their reply link"></textarea>
        <button id="connect" type="button">Connect</button>
      </section>
      <canvas id="qr" width="0" height="0"></canvas>
      <!-- The one thing a player should know before sharing: see README,
           "Signalling". -->
      <p style="margin:0;font-size:11px;color:#5c6472">The invite link
        contains your public IP — that is how a direct peer-to-peer
        connection works. Share it like you'd share your phone number.</p>
    </div>
    <pre id="log"></pre>
  </section>
</body>
</html>
