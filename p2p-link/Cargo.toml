[package]
name = "p2p-link"
version = "0.1.0"
edition = "2024"

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Location",
  "console",

  # WebRTC
  "RtcPeerConnection",
  "RtcConfiguration",
  "RtcIceServer",
  "RtcIceGatheringState",
  "RtcSessionDescription",
  "RtcSessionDescriptionInit",
  "RtcSdpType",
  "RtcDataChannel",
  "RtcDataChannelEvent",
  "RtcDataChannelInit",
  "RtcDataChannelState",
  "RtcDataChannelType",
  "RtcPeerConnectionState",
  "RtcIceConnectionState",
  "MessageEvent",

  # Deflate via the platform's CompressionStream — the two stream
  # constructors are declared in zip.rs; web-sys puts them behind
  # --cfg=web_sys_unstable_apis, which would infect every build.
  "ReadableStream",
  "WritableStream",
  "ReadableWritablePair",
  "Blob",
  "Response",
]
